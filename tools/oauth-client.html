<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogger OAuth Client</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .hidden { display: none; }
        #message { margin: 20px 0; padding: 15px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Blogger API OAuth Client</h1>
    <p>Este cliente obtiene tokens de acceso para la API de Blogger usando Google Identity Services.</p>
    
    <div id="auth-section">
        <div id="g-id-button"></div>
    </div>
    
    <div id="token-section" class="hidden">
        <h2>Token obtenido</h2>
        <p><strong>Access Token:</strong></p>
        <pre id="access-token"></pre>
        <p><strong>Expires in:</strong> <span id="expires-in"></span> seconds</p>
        <button onclick="useToken()">Usar este token para la API</button>
    </div>
    
    <div id="message" class="hidden"></div>
    
    <script>
        const CLIENT_ID = '349136899931-o98v9db44quvf8mvu061k7uu9nf7ssam.apps.googleusercontent.com';
        const API_KEY = 'YOUR_API_KEY'; // Replace with your API key for public data
        
        function handleCredentialResponse(response) {
            const credential = response.credential;
            const jwt = credential.split('.');
            const payload = JSON.parse(atob(jwt[1]));
            
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('token-section').classList.remove('hidden');
            document.getElementById('message').classList.remove('hidden');
            document.getElementById('message').textContent = 'Autenticación exitosa';
            document.getElementById('message').className = 'success';
            
            fetch('https://www.googleapis.com/oauth2/v3/userinfo')
                .then(res => res.json())
                .then(info => {
                    console.log('User info:', info);
                });
        }
        
        function useToken() {
            const credential = google.accounts.id.getToken();
            if (credential) {
                alert('Token listo. Puedes usarlo para llamar a la API de Blogger.');
                console.log('Access token:', credential.access_token);
            }
        }
        
        window.onload = function() {
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse,
                scope: 'https://www.googleapis.com/auth/blogger'
            });
            google.accounts.id.renderButton(document.getElementById('g-id-button'), {
                theme: 'outline',
                text: 'signin_with',
                shape: 'circle',
                size: 'large'
            });
        };
    </script>
</body>
</html>
