name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build (no-op for static site)
        run: |
          echo "Static site - no build step needed"
          # Verify required files exist
          test -f index.html
          test -f js/app.js
          test -f js/faucets.js
          test -f css/style.css
          test -f blog/index.html
          # Clean up files that shouldn't be deployed
          rm -rf tools .hermes secrets .git node_modules .github .vscode 2>/dev/null || true
          # Remove any .env or secret files
          find . -name ".env*" -delete 2>/dev/null || true
          find . -name "*.key" -delete 2>/dev/null || true
          find . -name "*.pem" -delete 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4